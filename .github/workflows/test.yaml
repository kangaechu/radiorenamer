name: test
permissions:
  contents: read

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
    - uses: actions/checkout@v6.0.3
      with:
        persist-credentials: false
    - uses: actions/setup-go@v6.4.0
      with:
        go-version-file: go.mod
    - name: test
      run: go test ./...
